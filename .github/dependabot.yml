version: 2
updates:
    - package-ecosystem: "github-actions"
      directories:
          - "/"
          - "/.github/actions/*"
      schedule:
          interval: "monthly"
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns:
                  - "*"
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "monthly"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          dev-dependencies:
              dependency-type: "development"
              update-types:
                  - "minor"
                  - "patch"
