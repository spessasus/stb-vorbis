name: Setup
description: Install Node, optionally Emscripten, and the npm dependencies

inputs:
    node-version:
        description: Node version, defaults to the one in .node-version
        required: false
        default: ""
    emscripten:
        description: Install Emscripten (needed to build the wasm)
        required: false
        default: "false"
    registry-url:
        description: npm registry to publish to
        required: false
        default: ""

runs:
    using: composite
    steps:
        - name: Setup Emscripten
          if: inputs.emscripten == 'true'
          uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
          with:
              version: 6.0.6
              actions-cache-folder: .emsdk-cache

        - name: Setup Node
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version: ${{ inputs.node-version }}
              node-version-file: .node-version
              registry-url: ${{ inputs.registry-url }}
              cache: npm

        - name: Install dependencies
          shell: bash
          run: npm ci
